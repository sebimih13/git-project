global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: trace2-collector
    static_configs:
      - targets: [collector:8888]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
