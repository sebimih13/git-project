receivers:
  trace2receiver:
    socket: /run/trace2/trace2.sock
    filter:
      defaults:
        ruleset: dl:verbose

processors:
  resource:
    attributes:
      - key: service.name
        value: git
        action: upsert
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
    sending_queue:
      queue_size: 1024
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [trace2receiver]
      processors: [resource, batch]
      exporters: [otlp/tempo]
